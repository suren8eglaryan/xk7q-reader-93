<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Читалка EN→RU</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.hide{display:none!important}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;padding:8px 12px 26px;margin-bottom:-14px;background:linear-gradient(to bottom,var(--bg) 0,var(--bg) 55%,transparent 100%);font:15px -apple-system,Helvetica,sans-serif;pointer-events:none}

#top button,#top label.btn{background:var(--bar)}
#title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.55}
button,label.btn,a.btn{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--fg)}
a.btn{text-decoration:none;font-weight:600}
button.on{font-weight:600;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
#book{max-width:680px;margin:0 auto;padding:16px 36px 120px;font-size:26px;line-height:1.5}
#book p,#book li{margin:0 0 .7em;text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
#book h1,#book h2,#book h3,#book h4{text-align:center;line-height:1.25;margin:1.6em 0 1.2em;font-weight:700;hyphens:none}
#book h1{font-size:1.9em}#book h2{font-size:1.5em}#book h3,#book h4{font-size:1.2em}
#book hr{border:0;text-align:center;margin:1.4em 0}#book hr::after{content:"* * *";letter-spacing:.4em;opacity:.6}
#book blockquote{margin:1em 1.5em;font-style:italic}
#book img,#book svg{display:none}

#set,#sp{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:6;max-height:75vh;overflow:auto;padding:12px;border-radius:14px;background:var(--bar);box-shadow:0 6px 24px rgba(0,0,0,.25);font:15px -apple-system,Helvetica,sans-serif;display:flex;flex-direction:column;gap:10px}

#set span{width:64px;flex:none}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));font:15px -apple-system,Helvetica,sans-serif;pointer-events:none}
#card{pointer-events:auto;display:flex;flex-direction:column;gap:8px;margin:0 auto;max-width:520px;padding:10px 12px;border-radius:14px;background:var(--bar);box-shadow:0 4px 18px rgba(0,0,0,.2)}

#card .hd{display:flex;align-items:flex-start;gap:8px}

#empty{padding:60px 24px;text-align:center;font:17px -apple-system,Helvetica,sans-serif;line-height:1.5}
</style>
</head>
<body>
<div id="top">
  <label class="btn">Открыть EPUB<input id="file" type="file" accept=".epub,application/epub+zip" hidden></label>
  <span id="title"></span>
  <button id="sb" aria-label="Поиск">🔍</button>
  <button id="aa">Aa</button>
  <button id="prev">‹</button><button id="next">›</button>
</div>
<div id="empty">Откройте EPUB-файл.<br>Под каждым английским предложением появится русский перевод. Тап по слову подсвечивает его перевод.<br>Сначала введите ключ API: Aa → Перевод.</div>
<div id="sp" class="hide"><div class="top"><input id="sq" type="search" placeholder="Поиск по книге"><button id="sgo">Найти</button><button id="sx">✕</button></div><div id="scount"></div><div id="sres"></div></div>
<div id="set" class="hide">
  <div><span>Размер</span><button data-a="f-">A−</button><button data-a="f+">A+</button></div>
  <div><span>Поля</span><button data-a="p-">Меньше</button><button data-a="p+">Больше</button></div>
  <div><span>Русский</span><button data-a="ru:1">Показать</button><button data-a="ru:0">Скрыть</button></div>
  <div><span>Фон</span><button data-a="t:white">Белый</button><button data-a="t:beige">Бежевый</button><button data-a="t:dark">Тёмный</button></div>
  <div><span>Перевод</span><input id="aUrl" placeholder="API URL" autocapitalize="off" autocorrect="off"></div>
  <div><span>Формат</span><select id="aFmt"><option value="anthropic">Anthropic</option><option value="openai">OpenAI</option></select></div>
  <div><span>Ключ</span><input id="aKey" type="password" placeholder="API key"></div>
  <div><span>Модель</span><input id="aMod" placeholder="model" autocapitalize="off" autocorrect="off"></div>
  <div><button id="aOk">Сохранить</button><button id="aClr">Очистить кэш</button></div>
</div>
<div id="book" class="hide" lang="en"></div>
<div id="toast" class="hide"></div>
<div id="bar"><div id="card" class="hide">
  <div class="hd"><div id="phrase"></div><button id="clear" aria-label="Закрыть">✕</button></div>
  <div class="row"><a id="gg" class="btn" href="#">Google</a><a id="go" class="btn" href="#" target="_blank" rel="noopener">Reverso</a></div>
</div></div>
<script>
var chapters=[],idx=0,bookId="book",gen=0,blocks=[],queue=[],active=0,paused=false,io=null;
var $=function(i){return document.getElementById(i)},book=$("book");
var S={fs:26,pad:36,theme:"white",ru:true,api:{url:"https://openrouter.ai/api/v1",key:"",model:""}};
try{var sv=JSON.parse(localStorage.getItem("rr4")||"null");if(sv)S=Object.assign(S,sv)}catch(x){}
var SEL="p,h1,h2,h3,h4,h5,h6,li";
var SYS="You are a translation engine for a bilingual English-to-Russian book reader. Input: one paragraph as numbered words plus its original text. Reply with ONLY JSON, no prose:\n{\"s\":[[[from,to,\"ru\"],...],...]}\n- \"s\" = sentences in order; each sentence = list of units; unit = [first word number, last word number, Russian text].\n- Units must cover every word number exactly once, in order, no gaps; sentences too.\n- Make units as small as possible, ideally one English word each. Merge words into one unit only when they cannot be translated apart (articles, auxiliaries, prepositions fusing into a Russian case or word, phrasal verbs, idioms).\n- Read in order, the Russian texts of the units must form a fluent, grammatically correct Russian sentence (cases, gender, number, agreement, verb forms) that follows the English word order as closely as possible. If grammar forces a reorder, merge the affected words into one unit.\n- Literal, no embellishment, no omissions; a unit's Russian text is never empty.\n- Put punctuation (commas, dashes, quotes, brackets, final period) inside the Russian text of the neighbouring unit, as in the English. Start each Russian sentence with a capital. Keep tokens like fn1 and digits unchanged; keep ALL-CAPS names in caps.";

function resolve(base,href){var o=[];(base+href).split("/").forEach(function(p){if(p==="..")o.pop();else if(p&&p!==".")o.push(p)});return decodeURIComponent(o.join("/"))}
function wrapWords(root){
  var wk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[],n,cnt=0,re=/[\p{L}\p{N}][\p{L}\p{N}'’\-]*/gu;
  while((n=wk.nextNode()))nodes.push(n);
  nodes.forEach(function(t){
    var s=t.nodeValue;if(!/\p{L}/u.test(s))return;
    var f=document.createDocumentFragment(),last=0,m;re.lastIndex=0;
    while((m=re.exec(s))){
      if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));
      var sp=document.createElement("span");sp.className="w";sp.textContent=m[0];sp.setAttribute("data-i",cnt++);f.appendChild(sp);
      last=m.index+m[0].length;
    }
    if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
    t.parentNode.replaceChild(f,t);
  });
}
/* storage */
var dbp=null;
function db(){return dbp||(dbp=new Promise(function(res,rej){var r=indexedDB.open("reader2",1);r.onupgradeneeded=function(){r.result.createObjectStore("b");r.result.createObjectStore("t")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}))}
function kv(st,mode,fn){return db().then(function(d){return new Promise(function(res){var q=fn(d.transaction(st,mode).objectStore(st));q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
/* translation */
function toast(m){var t=$("toast");t.textContent=m+" (тап — повторить)";t.classList.remove("hide")}
async function callApi(user){
  var c=S.api,base=c.url.replace(/\/+$/,""),anth=c.fmt!=="openai",r,j;
  if(anth)r=await fetch(base.replace(/\/v1$/,"")+"/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:c.model,max_tokens:8000,system:SYS,messages:[{role:"user",content:user}]})});
  else r=await fetch(base+"/chat/completions",{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+c.key},body:JSON.stringify({model:c.model,temperature:0.2,messages:[{role:"system",content:SYS},{role:"user",content:user}]})});
  if(!r.ok)throw new Error("API "+r.status+": "+(await r.text()).slice(0,100));
  j=await r.json();
  return anth?j.content.map(function(x){return x.text||""}).join(""):j.choices[0].message.content;
}
function fix(d,n){
  var s=d&&d.s,nx=0,out=[];if(!Array.isArray(s))return null;
  for(var a=0;a<s.length;a++){
    if(!Array.isArray(s[a])||!s[a].length)return null;var us=[];
    for(var k=0;k<s[a].length;k++){var u=s[a][k];
      if(!Array.isArray(u)||+u[0]!==nx||+u[1]<nx||typeof u[2]!=="string")return null;
      us.push([+u[0],+u[1],u[2]]);nx=+u[1]+1}
    out.push(us);
  }
  return nx===n?out:null;
}
async function translate(el){
  var c=S.api;if(!c.key||!c.model)throw new Error("Укажите ключ и модель: Aa → Перевод");
  var ws=el._ws,user="Words:\n"+ws.map(function(w,i){return i+":"+w.textContent}).join(" ")+"\n\nText:\n"+el.textContent.replace(/\s+/g," ").trim();
  for(var t=0;t<2;t++){
    var o=await callApi(user),m=o.match(/\{[\s\S]*\}/);
    try{var d=fix(JSON.parse(m[0]),ws.length);if(d)return d}catch(e){}
  }
  var b=[[[0,ws.length-1,"(перевод не удался)"]]];b.bad=1;return b;
}
function pump(){
  while(!paused&&active<3&&queue.length){
    var j=queue.shift();if(j.g!==gen)continue;active++;
    work(j).then(function(){active--;pump()});
  }
}
async function work(j){
  var el=j.el,key=bookId+"|"+idx+"|"+el._k,d=await kv("t","readonly",function(s){return s.get(key)});
  if(j.g!==gen)return;
  if(!d){
    try{d=await translate(el)}catch(e){el._st=0;paused=true;toast(e.message);return}
    if(j.g!==gen)return;
    if(!d.bad)kv("t","readwrite",function(s){return s.put(d,key)});
  }
  render(el,d);el._st=2;
}
function render(el,d){
  var h0=el.getBoundingClientRect().height,ws=el._ws,divs=[];
  d.forEach(function(sent,k){
    var en=document.createElement("div"),ru=document.createElement("div"),s=document.createElement("div");
    en.className="en";ru.className="ru";ru.lang="ru";s.className="s";
    if(k<d.length-1){var rg=document.createRange();rg.setStart(el,0);rg.setEndBefore(ws[d[k+1][0][0]]);en.appendChild(rg.extractContents())}
    else while(el.firstChild)en.appendChild(el.firstChild);
    sent.forEach(function(u,j){
      var sp=document.createElement("span");sp.className="r";sp.textContent=u[2];
      if(j)ru.appendChild(document.createTextNode(" "));ru.appendChild(sp);
      for(var i=u[0];i<=u[1];i++)ws[i]._r=sp;
    });
    s.appendChild(en);s.appendChild(ru);divs.push(s);
  });
  while(el.firstChild)el.removeChild(el.firstChild);
  divs.forEach(function(x){el.appendChild(x)});
  var r=el.getBoundingClientRect(),dh=r.height-h0;
  if(r.bottom<60&&dh)window.scrollBy(0,dh);
  hl();
}
function watch(){
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting&&!e.target._st){e.target._st=1;queue.push({el:e.target,g:gen})}});
    pump();
  },{rootMargin:"1500px 0px 2500px 0px"});
  blocks=[].filter.call(book.querySelectorAll(SEL),function(e){return !e.querySelector(SEL)&&e.querySelector(".w")});
  blocks.forEach(function(e,k){e._k=k;e._ws=[].slice.call(e.querySelectorAll(".w"));io.observe(e)});
}
function kick(){
  $("toast").classList.add("hide");paused=false;queue=[];
  blocks.forEach(function(e){if(e._st!==2){e._st=0;io.unobserve(e);io.observe(e)}});
}
$("toast").onclick=kick;
/* reader */
function show(i){
  if(i<0||i>=chapters.length)return;
  idx=i;gen++;queue=[];paused=false;$("toast").classList.add("hide");
  book.innerHTML=chapters[i];wrapWords(book);clearSel();window.scrollTo(0,0);watch();
}
function selected(){return [].slice.call(book.querySelectorAll(".w.sel"))}
function hl(){
  book.querySelectorAll(".r.rh").forEach(function(e){e.classList.remove("rh")});
  selected().forEach(function(w){if(w._r)w._r.classList.add("rh")});
}
function clearSel(){selected().forEach(function(e){e.classList.remove("sel")});updateBar()}
function updateBar(){
  var words=selected().map(function(e){return e.textContent}),p=words.join(" ");
  $("phrase").textContent=p;$("card").classList.toggle("hide",!words.length);hl();
  if(words.length){
    $("go").href="https://context.reverso.net/translation/english-russian/"+encodeURIComponent(p).replace(/%20/g,"+");
    $("gg").href="googletranslate://?sl=en&tl=ru&text="+encodeURIComponent(p);
  }
}
book.addEventListener("click",function(e){var w=e.target.closest(".w");if(!w)return;w.classList.toggle("sel");updateBar()});
$("clear").onclick=clearSel;
function applyS(){
  document.documentElement.setAttribute("data-theme",S.theme);
  book.style.fontSize=S.fs+"px";book.style.paddingLeft=book.style.paddingRight=S.pad+"px";
  book.classList.toggle("norus",!S.ru);
  try{localStorage.setItem("rr4",JSON.stringify(S))}catch(x){}
}
$("aa").onclick=function(){$("set").classList.toggle("hide")};
$("set").addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
  if(a==="f-")S.fs=Math.max(14,S.fs-1);
  if(a==="f+")S.fs=Math.min(40,S.fs+1);
  if(a==="p-")S.pad=Math.max(4,S.pad-4);
  if(a==="p+")S.pad=Math.min(90,S.pad+4);
  if(a.indexOf("t:")===0)S.theme=a.slice(2);
  if(a.indexOf("ru:")===0)S.ru=a.slice(3)==="1";
  applyS();
});
$("aFmt").value=S.api.fmt||"anthropic";$("aUrl").value=S.api.url;$("aKey").value=S.api.key;$("aMod").value=S.api.model;
$("aOk").onclick=function(){
  S.api={fmt:$("aFmt").value,url:$("aUrl").value.trim(),key:$("aKey").value.trim(),model:$("aMod").value.trim()};
  applyS();$("set").classList.add("hide");kick();
};
$("aClr").onclick=function(){kv("t","readwrite",function(s){return s.clear()});if(chapters.length)show(idx)};
/* position */
function loadPos(){try{return JSON.parse(localStorage.getItem("pos:"+bookId))}catch(x){return null}}
function gotoWord(i){var w=book.querySelector('.w[data-i="'+i+'"]');if(w)window.scrollTo(0,Math.max(0,w.getBoundingClientRect().top+window.scrollY-85))}
var spT=0;
function savePos(){
  if(book.classList.contains("hide"))return;
  var ws=book.querySelectorAll(".w"),lo=0,hi=ws.length-1;if(!ws.length)return;
  while(lo<hi){var m=(lo+hi)>>1;if(ws[m].getBoundingClientRect().top<90)lo=m+1;else hi=m}
  try{localStorage.setItem("pos:"+bookId,JSON.stringify({ch:idx,i:+ws[lo].getAttribute("data-i")}))}catch(x){}
}
window.addEventListener("scroll",function(){clearTimeout(spT);spT=setTimeout(savePos,400)},{passive:true});
document.addEventListener("visibilitychange",function(){if(document.hidden)savePos()});
window.addEventListener("pagehide",savePos);
/* search */
var texts=[],lower=[];
function closeSearch(){$("sp").classList.add("hide");$("sq").blur()}
function doSearch(){
  var q=$("sq").value.trim().toLowerCase(),box=$("sres"),out=[],n=0;box.innerHTML="";
  if(q.length<2){$("scount").textContent="Введите минимум 2 символа";return}
  for(var c=0;c<lower.length&&n<200;c++){var p=0;while(n<200&&(p=lower[c].indexOf(q,p))>-1){out.push({c:c,o:p});n++;p+=q.length}}
  $("scount").textContent=n?"Найдено: "+n+(n>=200?"+":""):"Ничего не найдено";
  out.forEach(function(r){
    var t=texts[r.c],a=Math.max(0,r.o-35),b=Math.min(t.length,r.o+q.length+55);
    var btn=document.createElement("button"),sm=document.createElement("small"),m=document.createElement("b");
    btn.className="res";sm.textContent="часть "+(r.c+1);m.textContent=t.substr(r.o,q.length);btn.appendChild(sm);
    btn.appendChild(document.createTextNode((a>0?"…":"")+t.slice(a,r.o).replace(/\s+/g," ")));btn.appendChild(m);
    btn.appendChild(document.createTextNode(t.slice(r.o+q.length,b).replace(/\s+/g," ")+(b<t.length?"…":"")));
    btn.onclick=function(){goHit(r,q.length)};box.appendChild(btn);
  });
}
function goHit(r,len){
  closeSearch();if(r.c!==idx)show(r.c);
  var wk=document.createTreeWalker(book,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentNode.closest(".ru")?2:1}}),n,pos=0,sn=null,so=0,en=null,eo=0,e=r.o+len;
  while((n=wk.nextNode())){
    var l=n.nodeValue.length;
    if(!sn&&r.o<pos+l){sn=n;so=r.o-pos}
    if(sn&&e<=pos+l){en=n;eo=e-pos;break}
    pos+=l;
  }
  if(!sn||!en)return;
  var rg=document.createRange();rg.setStart(sn,so);rg.setEnd(en,eo);
  window.scrollTo(0,Math.max(0,rg.getBoundingClientRect().top+window.scrollY-170));
  var hits=[];book.querySelectorAll(".w").forEach(function(w){if(rg.intersectsNode(w)){w.classList.add("hit");hits.push(w)}});
  setTimeout(function(){hits.forEach(function(w){w.classList.remove("hit")})},4000);
}
$("sb").onclick=function(){if(!chapters.length)return;$("sp").classList.toggle("hide");if(!$("sp").classList.contains("hide"))$("sq").focus()};
$("sx").onclick=closeSearch;$("sgo").onclick=doSearch;
$("sq").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
$("prev").onclick=function(){show(idx-1)};$("next").onclick=function(){show(idx+1)};
/* open book */
$("file").addEventListener("change",async function(){
  var f=this.files[0];if(!f)return;var buf=await f.arrayBuffer();
  kv("b","readwrite",function(s){return s.put({name:f.name,buf:buf},"last")});openBook(buf,f.name);
});
async function openBook(f,fname){
  try{
    var zip=await JSZip.loadAsync(f),P=new DOMParser();
    var cont=P.parseFromString(await zip.file("META-INF/container.xml").async("string"),"text/xml");
    var opfPath=cont.querySelector("rootfile").getAttribute("full-path");
    var base=opfPath.indexOf("/")>-1?opfPath.slice(0,opfPath.lastIndexOf("/")+1):"";
    var opf=P.parseFromString(await zip.file(opfPath).async("string"),"text/xml"),man={};
    opf.querySelectorAll("manifest > item").forEach(function(it){man[it.getAttribute("id")]=it.getAttribute("href")});
    var t=opf.getElementsByTagNameNS("*","title")[0];
