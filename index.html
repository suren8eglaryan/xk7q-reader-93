function place(el,k,node){

function wtext(el,i){

function fixA(d,n){
  if(!d||typeof d.tr!=="string"||!Array.isArray(d.seg))return null;
  var seen={},c=0;
  for(var a=0;a<d.seg.length;a++){
    var sg=d.seg[a];if(!sg||!Array.isArray(sg.w)||!sg.w.length)return null;
    for(var b=0;b<sg.w.length;b++){var x=sg.w[b],i=+x.i;if(!(i>=0&&i<n)||seen[i])return null;seen[i]=1;c++;x.i=i}
    sg.w.sort(function(p,q){return p.i-q.i});
  }
  return c===n?d:null;
}
function ip(t){return String(t||"").replace(/[\[\]\/]/g,"").trim()}
function dxHtml(x,phr){

  if(id.length){h+='<div class="sec">ИДИОМЫ</div>';id.forEach(function(p){h+=it(p)})}

function buildAn(el,sn,d){
  var ws=el._ws,node=document.createElement("div"),h="",phr=Array.isArray(d.phr)?d.phr:[];node.className="an";

    sg.w.forEach(function(x){h+='<span class="wd"><small>'+esc(ip(x.ipa))+"</small><span>"+esc(wtext(el,sn[0]+x.i))+"</span></span>"});
    h+='</div><div class="sru"><i>'+esc(sg.ru||"")+'</i></div></div><span class="chev">⌄</span></div><div class="sgb hide">';
    sg.w.forEach(function(x){
      var word=ws[sn[0]+x.i].textContent;
      h+='<div class="wc" data-w="'+esc(word)+'"><div class="wh"><span class="wn">'+esc(word)+"</span><small>"+esc(ip(x.ipa))+'</small><span class="wp">· '+esc(x.pos||"")+'</span><span class="chev">⌄</span></div><div class="wr"><i>'+esc(x.ru||"")+"</i></div>"+(x.n?'<div class="nt">'+esc(x.n)+"</div>":"")+'<div class="dx hide">'+dxHtml(x,phr)+"</div></div>";

async function analyze(){
  if(!selS){toast("Сначала коснитесь предложения",1);return}
  var s=selS,el=s.el,k=s.k,sn=s.sn,ws=el._ws;
  if(s.node){if(!s.node.parentNode)place(el,k,s.node);return}
  var rg=document.createRange();rg.setStartBefore(ws[sn[0]]);
  if(ws[sn[1]+1])rg.setEndBefore(ws[sn[1]+1]);else rg.setEnd(el,el.childNodes.length);
  var user="Words:\n"+s.ws.map(function(w,i){return i+":"+w.textContent}).join(" ")+"\n\nSentence:\n"+rg.toString().replace(/\s+/g," ").trim()+"\n\nParagraph (context only):\n"+el.textContent.replace(/\s+/g," ").trim().slice(0,1200);
  var key="a2|"+hash(user),my=++anTok,d=await kv("t","readonly",function(st){return st.get(key)});
  if(!d){
    busy(true,"Анализирую предложение…",my);
    try{
      for(var t=0;t<2&&!d;t++){var o=await callApi(user,SYS4);try{d=fixA(JSON.parse(o.match(/\{[\s\S]*\}/)[0]),s.ws.length)}catch(e){d=null}}

/* search */
var texts=[],lower=[];
function closeSearch(){$("sp").classList.add("hide");$("sq").blur()}
function doSearch(){
  var q=$("sq").value.trim().toLowerCase(),box=$("sres"),out=[],n=0;box.innerHTML="";
  if(q.length<2){$("scount").textContent="Введите минимум 2 символа";return}
  for(var c=0;c<lower.length&&n<200;c++){var p=0;while(n<200&&(p=lower[c].indexOf(q,p))>-1){out.push({c:c,o:p});n++;p+=q.length}}
  $("scount").textContent=n?"Найдено: "+n+(n>=200?"+":""):"Ничего не найдено";
  out.forEach(function(r){
    var t=texts[r.c],a=Math.max(0,r.o-35),b=Math.min(t.length,r.o+q.length+55);
    var btn=document.createElement("button"),sm=document.createElement("small"),m=document.createElement("b");
    btn.className="res";sm.textContent="часть "+(r.c+1);m.textContent=t.substr(r.o,q.length);btn.appendChild(sm);
    btn.appendChild(document.createTextNode((a>0?"…":"")+t.slice(a,r.o).replace(/\s+/g," ")));btn.appendChild(m);
    btn.appendChild(document.createTextNode(t.slice(r.o+q.length,b).replace(/\s+/g," ")+(b<t.length?"…":"")));
    btn.onclick=function(){goHit(r,q.length)};box.appendChild(btn);
  });
}
function goHit(r,len){
  closeSearch();if(r.c!==idx)show(r.c);
  var wk=document.createTreeWalker(book,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentNode.closest(".an")?2:1}}),n,pos=0,sn=null,so=0,en=null,eo=0,e=r.o+len;
  while((n=wk.nextNode())){
    var l=n.nodeValue.length;
    if(!sn&&r.o<pos+l){sn=n;so=r.o-pos}
    if(sn&&e<=pos+l){en=n;eo=e-pos;break}
    pos+=l;
  }
  if(!sn||!en)return;
  var rg=document.createRange();rg.setStart(sn,so);rg.setEnd(en,eo);
  window.scrollTo(0,Math.max(0,rg.getBoundingClientRect().top+window.scrollY-170));
  var hits=[];book.querySelectorAll(".w").forEach(function(w){if(rg.intersectsNode(w)){w.classList.add("hit");hits.push(w)}});
  setTimeout(function(){hits.forEach(function(w){w.classList.remove("hit")})},4000);
}

async function openBook(f,fname){
  try{
    var zip=await JSZip.loadAsync(f),P=new DOMParser();
    var cont=P.parseFromString(await zip.file("META-INF/container.xml").async("string"),"text/xml");
    var opfPath=cont.querySelector("rootfile").getAttribute("full-path");
    var base=opfPath.indexOf("/")>-1?opfPath.slice(0,opfPath.lastIndexOf("/")+1):"";
    var opf=P.parseFromString(await zip.file(opfPath).async("string"),"text/xml"),man={};
    opf.querySelectorAll("manifest > item").forEach(function(it){man[it.getAttribute("id")]=it.getAttribute("href")});
    var t=opf.getElementsByTagNameNS("*","title")[0];
    $("title").textContent=t?t.textContent:fname;bookId=$("title").textContent;
    chapters=[];var refs=opf.querySelectorAll("spine > itemref");
    for(var k=0;k<refs.length;k++){
      var href=man[refs[k].getAttribute("idref")];if(!href)continue;
      var zf=zip.file(resolve(base,href));if(!zf)continue;
      var doc=P.parseFromString(await zf.async("string"),"text/html");
      doc.querySelectorAll("script,style,link,img,svg,image").forEach(function(x){x.remove()});
      doc.querySelectorAll("[style],[align]").forEach(function(x){x.removeAttribute("style");x.removeAttribute("align")});
      var html=doc.body?doc.body.innerHTML:"";
      if(html.replace(/<[^>]+>/g,"").trim().length>0)chapters.push(html);
    }
    if(!chapters.length)throw new Error("empty");
    $("empty").classList.add("hide");book.classList.remove("hide");
    var d=document.createElement("div");
    texts=chapters.map(function(h){d.innerHTML=h;return d.textContent});lower=texts.map(function(x){return x.toLowerCase()});
    var pos=loadPos(),ok=pos&&pos.ch<chapters.length;
    show(ok?pos.ch:0);if(ok)gotoWord(pos.i);
  }catch(err){$("empty").classList.remove("hide");$("empty").textContent="Не удалось прочитать этот EPUB."}
}
