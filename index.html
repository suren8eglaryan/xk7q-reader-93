function cap(t){t=String(t||"").toLowerCase();return t.charAt(0).toUpperCase()+t.slice(1)}
async function openCard(bl,title,anchor){
  var my=++cardTok,sh=$("sheet"),d;cardB=bl[0].ws?bl[0]:null;
  var user=bl.map(function(b,j){return "Sentence "+(j+1)+": "+b.text+"\nWords: "+b.words.map(function(w,i){return i+":"+w}).join(" ")+"\nTapped word: "+b.sel.join(",")}).join("\n\n");
  var key="c4|"+hash(user);
  sh.innerHTML='<button class="ib" id="cx">✕</button><div class="chd"><div class="ct">'+esc(title)+'</div><div class="mut" id="chm"></div></div><div id="cb" class="cbody mut">Анализирую… 0.0 с</div>';
  openS("sheet");$("cx").onclick=closeS;sh.scrollTop=0;
  if(anchor){var ar=anchor.getBoundingClientRect();if(ar.bottom>innerHeight*0.5)window.scrollBy(0,ar.bottom-innerHeight*0.35)}
  d=await kv("t","readonly",function(st){return st.get(key)});
  if(my!==cardTok)return;
  if(!d){
    var t0=Date.now(),iv=setInterval(function(){var c=$("cb");if(c)c.textContent="Анализирую… "+((Date.now()-t0)/1000).toFixed(1)+" с"},100);
    try{
      var o=await callApi(user,SYS3);d=JSON.parse(o.match(/\{[\s\S]*\}/)[0]);
      if(!Array.isArray(d.tr))throw new Error("неверный формат ответа");
      kv("t","readwrite",function(st){return st.put(d,key)});
    }catch(e){
      clearInterval(iv);if(my!==cardTok)return;
      $("cb").innerHTML="<div>"+esc("Не удалось: "+e.message)+'</div><a class="mo" id="rt">Повторить</a>';
      $("rt").onclick=function(){openCard(bl,title,anchor)};return;
    }
    clearInterval(iv);if(my!==cardTok)return;
  }
  var h="";
  if(bl[0].ws){
    h+='<div class="sec" style="margin-top:6px">В ПРЕДЛОЖЕНИИ</div>';
    if(d.col&&d.col.text){
      h+='<div class="cl" data-i="'+esc(JSON.stringify(d.col.w||[]))+'"><b>'+esc(d.col.text)+'</b><span class="tag">'+esc(d.col.type||"")+"</span></div>"+lis(d.col.m,4);
    }else h+='<div class="alone">Самостоятельное слово: в этом предложении оно не входит ни в какое сочетание.</div>';
    if(Array.isArray(d.idioms)&&d.idioms.length){
      h+='<div class="sec">ИДИОМЫ</div>';
      d.idioms.forEach(function(x){h+='<div class="cl" data-i="'+esc(JSON.stringify(x.w||[]))+'"><b>'+esc(x.text||"")+'</b></div><div class="mut" style="margin:2px 0 8px">'+esc(x.m||"")+"</div>"});
    }
  }
  h+='<div class="sec">ПЕРЕВОДЫ</div>';
  d.tr.slice(0,5).forEach(function(g){h+='<div class="ph">'+esc(cap(g.n))+"</div>"+lis(g.t,3)});
  $("chm").textContent=[d.ipa,cap(d.pos)].filter(Boolean).join(" · ");
  var cb=$("cb");if(cb)cb.outerHTML='<div id="cb" class="cbody">'+h+"</div>";
  if(d.col&&d.col.w)showCol(d.col.w);
}
$("sheet").addEventListener("click",function(e){
  var m=e.target.closest(".mo"),l=e.target.closest(".rl"),c=e.target.closest(".cl");
  if(m&&m.previousElementSibling){m.previousElementSibling.querySelectorAll(".more").forEach(function(x){x.classList.remove("hide")});m.remove()}
  if(l){cardB=null;showCol(null);openCard([{words:[l.textContent],text:l.textContent,sel:[0]}],l.textContent)}
  if(c){try{showCol(JSON.parse(c.getAttribute("data-i")))}catch(x){}}
});
function applyS(){
  var de=document.documentElement,st=de.style;
  de.setAttribute("data-theme",S.theme);
  S.cSel?st.setProperty("--sel",S.cSel):st.removeProperty("--sel");
  book.style.fontSize=S.fs+"px";book.style.paddingLeft=book.style.paddingRight=S.pad+"px";
  var cs=getComputedStyle(de);
  $("cSel").value=S.cSel||cs.getPropertyValue("--sel").trim();
  try{localStorage.setItem("rr4",JSON.stringify(S))}catch(x){}
}
$("aa").onclick=function(){$("set").classList.toggle("hide")};
$("set").addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
  if(a==="f-")S.fs=Math.max(14,S.fs-1);
  if(a==="f+")S.fs=Math.min(40,S.fs+1);
  if(a==="p-")S.pad=Math.max(4,S.pad-4);
  if(a==="p+")S.pad=Math.min(90,S.pad+4);
  if(a.indexOf("t:")===0)S.theme=a.slice(2);
  if(a==="cs0")S.cSel=null;
  applyS();
});
$("aFmt").value=S.api.fmt||"openai";$("aUrl").value=S.api.url;$("aKey").value=S.api.key;$("aMod").value=S.api.model;
$("cSel").oninput=function(){S.cSel=this.value;applyS()};
$("aPre").onchange=function(){if(this.value)$("aMod").value=this.value};
$("aLs").onclick=async function(){
  var c={url:$("aUrl").value.trim().replace(/\/+$/,""),key:$("aKey").value.trim(),fmt:$("aFmt").value};
  try{
    var an=c.fmt==="anthropic",r=await fetch(an?c.url.replace(/\/v1$/,"")+"/v1/models":c.url+"/models",{headers:an?{"x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"}:{"Authorization":"Bearer "+c.key}});
    if(!r.ok)throw new Error("API "+r.status);
    var j=await r.json(),ids=(j.data||[]).map(function(m){return m.id}).filter(Boolean);
    if(!ids.length)throw new Error("список пуст");
    $("aPre").innerHTML='<option value="">Выбрать…</option>'+ids.map(function(i){return "<option>"+esc(i)+"</option>"}).join("");
  }catch(e){toast("Список моделей: "+e.message,1)}
};
$("aOk").onclick=function(){
  S.api={fmt:$("aFmt").value,url:$("aUrl").value.trim(),key:$("aKey").value.trim(),model:$("aMod").value.trim()};
  applyS();$("set").classList.add("hide");kick();
};
$("aClr").onclick=function(){kv("t","readwrite",function(s){return s.clear()});if(chapters.length)show(idx)};
/* position */
function loadPos(){try{return JSON.parse(localStorage.getItem("pos:"+bookId))}catch(x){return null}}
function gotoWord(i){var w=book.querySelector('.w[data-i="'+i+'"]');if(w)window.scrollTo(0,Math.max(0,w.getBoundingClientRect().top+window.scrollY-85))}
var spT=0;
function savePos(){
  if(book.classList.contains("hide"))return;
  var ws=book.querySelectorAll(".w"),lo=0,hi=ws.length-1;if(!ws.length)return;
  while(lo<hi){var m=(lo+hi)>>1;if(ws[m].getBoundingClientRect().top<90)lo=m+1;else hi=m}
  try{localStorage.setItem("pos:"+bookId,JSON.stringify({ch:idx,i:+ws[lo].getAttribute("data-i")}))}catch(x){}
}
window.addEventListener("scroll",function(){clearTimeout(spT);spT=setTimeout(savePos,400)},{passive:true});
document.addEventListener("visibilitychange",function(){if(document.hidden)savePos()});
window.addEventListener("pagehide",savePos);
/* search */
var texts=[],lower=[];
function closeSearch(){$("sp").classList.add("hide");$("sq").blur()}
function doSearch(){
  var q=$("sq").value.trim().toLowerCase(),box=$("sres"),out=[],n=0;box.innerHTML="";
  if(q.length<2){$("scount").textContent="Введите минимум 2 символа";return}
  for(var c=0;c<lower.length&&n<200;c++){var p=0;while(n<200&&(p=lower[c].indexOf(q,p))>-1){out.push({c:c,o:p});n++;p+=q.length}}
  $("scount").textContent=n?"Найдено: "+n+(n>=200?"+":""):"Ничего не найдено";
  out.forEach(function(r){
    var t=texts[r.c],a=Math.max(0,r.o-35),b=Math.min(t.length,r.o+q.length+55);
    var btn=document.createElement("button"),sm=document.createElement("small"),m=document.createElement("b");
    btn.className="res";sm.textContent="часть "+(r.c+1);m.textContent=t.substr(r.o,q.length);btn.appendChild(sm);
    btn.appendChild(document.createTextNode((a>0?"…":"")+t.slice(a,r.o).replace(/\s+/g," ")));btn.appendChild(m);
    btn.appendChild(document.createTextNode(t.slice(r.o+q.length,b).replace(/\s+/g," ")+(b<t.length?"…":"")));
    btn.onclick=function(){goHit(r,q.length)};box.appendChild(btn);
  });
}
function goHit(r,len){
  closeSearch();if(r.c!==idx)show(r.c);
  var wk=document.createTreeWalker(book,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentNode.closest(".ru")?2:1}}),n,pos=0,sn=null,so=0,en=null,eo=0,e=r.o+len;
  while((n=wk.nextNode())){
    var l=n.nodeValue.length;
    if(!sn&&r.o<pos+l){sn=n;so=r.o-pos}
    if(sn&&e<=pos+l){en=n;eo=e-pos;break}
    pos+=l;
  }
  if(!sn||!en)return;
  var rg=document.createRange();rg.setStart(sn,so);rg.setEnd(en,eo);
  window.scrollTo(0,Math.max(0,rg.getBoundingClientRect().top+window.scrollY-170));
  var hits=[];book.querySelectorAll(".w").forEach(function(w){if(rg.intersectsNode(w)){w.classList.add("hit");hits.push(w)}});
  setTimeout(function(){hits.forEach(function(w){w.classList.remove("hit")})},4000);
}
$("sb").onclick=function(){if(!chapters.length)return;$("sp").classList.toggle("hide");if(!$("sp").classList.contains("hide"))$("sq").focus()};
$("sx").onclick=closeSearch;$("sgo").onclick=doSearch;
$("sq").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
$("prev").onclick=function(){show(idx-1)};$("next").onclick=function(){show(idx+1)};
/* open book */
$("file").addEventListener("change",async function(){
  var f=this.files[0];if(!f)return;var buf=await f.arrayBuffer();
  kv("b","readwrite",function(s){return s.put({name:f.name,buf:buf},"last")});openBook(buf,f.name);
});
async function openBook(f,fname){
  try{
    var zip=await JSZip.loadAsync(f),P=new DOMParser();
    var cont=P.parseFromString(await zip.file("META-INF/container.xml").async("string"),"text/xml");
    var opfPath=cont.querySelector("rootfile").getAttribute("full-path");
    var base=opfPath.indexOf("/")>-1?opfPath.slice(0,opfPath.lastIndexOf("/")+1):"";
    var opf=P.parseFromString(await zip.file(opfPath).async("string"),"text/xml"),man={};
    opf.querySelectorAll("manifest > item").forEach(function(it){man[it.getAttribute("id")]=it.getAttribute("href")});
    var t=opf.getElementsByTagNameNS("*","title")[0];
    $("title").textContent=t?t.textContent:fname;bookId=$("title").textContent;
    chapters=[];var refs=opf.querySelectorAll("spine > itemref");
    for(var k=0;k<refs.length;k++){
      var href=man[refs[k].getAttribute("idref")];if(!href)continue;
      var zf=zip.file(resolve(base,href));if(!zf)continue;
      var doc=P.parseFromString(await zf.async("string"),"text/html");
      doc.querySelectorAll("script,style,link,img,svg,image").forEach(function(x){x.remove()});
      doc.querySelectorAll("[style],[align]").forEach(function(x){x.removeAttribute("style");x.removeAttribute("align")});
      var html=doc.body?doc.body.innerHTML:"";
      if(html.replace(/<[^>]+>/g,"").trim().length>0)chapters.push(html);
    }
    if(!chapters.length)throw new Error("empty");
    $("empty").classList.add("hide");book.classList.remove("hide");
    var d=document.createElement("div");
    texts=chapters.map(function(h){d.innerHTML=h;return d.textContent});lower=texts.map(function(x){return x.toLowerCase()});
    var pos=loadPos(),ok=pos&&pos.ch<chapters.length;
    show(ok?pos.ch:0);if(ok)gotoWord(pos.i);
  }catch(err){$("empty").classList.remove("hide");$("empty").textContent="Не удалось прочитать этот EPUB."}
}
applyS();
kv("b","readonly",function(s){return s.get("last")}).then(function(v){if(v&&v.buf)openBook(v.buf,v.name)});
</script>
